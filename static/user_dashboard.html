<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Credit Score</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #0f1117; --surface: #1a1d2e; --surface2: #232740; --border: #2e3348;
    --text: #e4e6f0; --text2: #9498b3;
    --accent: #6366f1; --accent2: #818cf8; --accent-glow: rgba(99,102,241,0.15);
    --green: #22c55e; --green-bg: rgba(34,197,94,0.1);
    --orange: #f59e0b; --orange-bg: rgba(245,158,11,0.1);
    --red: #ef4444; --red-bg: rgba(239,68,68,0.1);
    --radius: 16px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }

.topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 32px;
    background: var(--surface); border-bottom: 1px solid var(--border);
}
.topbar-left { display: flex; align-items: center; gap: 12px; }
.topbar-logo {
    width: 34px; height: 34px;
    background: linear-gradient(135deg, var(--accent), #a78bfa);
    border-radius: 9px; display: flex; align-items: center; justify-content: center;
    font-size: 0.9rem; font-weight: 800; color: #fff;
}
.topbar-title { font-size: 0.95rem; font-weight: 600; }
.topbar-right { display: flex; align-items: center; gap: 16px; }
.user-pill {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 14px 6px 8px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 99px; font-size: 0.82rem; color: var(--text2);
}
.user-avatar {
    width: 26px; height: 26px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #a78bfa);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.65rem; font-weight: 700; color: #fff;
}
.logout-btn {
    padding: 6px 14px; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text2); font-size: 0.8rem; font-family: 'Inter', sans-serif;
    cursor: pointer; text-decoration: none;
}
.logout-btn:hover { color: var(--text); border-color: var(--text2); }

.container { max-width: 900px; margin: 32px auto; padding: 0 24px; }

/* Score hero */
.score-hero {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 44px; text-align: center;
    margin-bottom: 24px; position: relative; overflow: hidden;
}
.score-hero::before {
    content: ''; position: absolute; top: -100px; left: 50%; transform: translateX(-50%);
    width: 400px; height: 400px; border-radius: 50%;
    background: radial-gradient(circle, var(--accent-glow), transparent 70%);
    pointer-events: none;
}
.score-ring {
    width: 180px; height: 180px; margin: 0 auto 20px; position: relative;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
}
.score-ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.score-ring .track { fill: none; stroke: var(--surface2); stroke-width: 8; }
.score-ring .progress { fill: none; stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 1s ease; }
.score-ring .inner { position: relative; z-index: 1; text-align: center; }
.score-ring .value { font-size: 2.8rem; font-weight: 800; letter-spacing: -2px; }
.score-ring .label { font-size: 0.72rem; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }
.risk-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 24px; border-radius: 99px;
    font-size: 0.85rem; font-weight: 600; letter-spacing: 0.3px;
}
.risk-LOW { background: var(--green-bg); color: var(--green); }
.risk-MEDIUM { background: var(--orange-bg); color: var(--orange); }
.risk-HIGH { background: var(--red-bg); color: var(--red); }
.risk-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.hero-sub { color: var(--text2); font-size: 0.85rem; margin-top: 12px; }

/* Info grid */
.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
.info-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 24px;
}
.info-card-title {
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.8px;
    color: var(--text2); font-weight: 600; margin-bottom: 16px;
}
.info-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(46,51,72,0.5); }
.info-row:last-child { border-bottom: none; }
.info-label { font-size: 0.82rem; color: var(--text2); }
.info-value { font-size: 0.88rem; font-weight: 600; }

/* Metric cards */
.metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
.metric-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px; text-align: center;
}
.metric-val { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px; margin: 6px 0 4px; }
.metric-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text2); font-weight: 600; }
.metric-bar { height: 4px; border-radius: 2px; background: var(--surface2); margin-top: 10px; overflow: hidden; }
.metric-bar-fill { height: 100%; border-radius: 2px; transition: width 0.8s ease; }

/* Tips */
.tips-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 24px;
}
.tips-card h3 { font-size: 0.95rem; font-weight: 600; margin-bottom: 16px; }
.tip {
    display: flex; gap: 12px; padding: 12px 0;
    border-bottom: 1px solid rgba(46,51,72,0.5);
    font-size: 0.85rem; color: var(--text2); line-height: 1.5;
}
.tip:last-child { border-bottom: none; }
.tip-icon {
    width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.9rem;
}

.loading-state { text-align: center; padding: 80px 20px; color: var(--text2); }
.loading-state .spinner {
    width: 36px; height: 36px; border: 3px solid var(--surface2);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.6s linear infinite; margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 640px) {
    .info-grid { grid-template-columns: 1fr; }
    .metrics { grid-template-columns: 1fr; }
    .container { padding: 0 16px; }
}
</style>
</head>
<body>

<div class="topbar">
    <div class="topbar-left">
        <div class="topbar-logo">CR</div>
        <span class="topbar-title">Credit Risk Portal</span>
    </div>
    <div class="topbar-right">
        <div class="user-pill">
            <div class="user-avatar" id="avatar">-</div>
            <span id="userId">__BORROWER_ID__</span>
        </div>
        <a href="/" class="logout-btn">Logout</a>
    </div>
</div>

<div class="container" id="content">
    <div class="loading-state">
        <div class="spinner"></div>
        <p>Loading your credit profile...</p>
    </div>
</div>

<script>
const BID = '__BORROWER_ID__';
document.getElementById('avatar').textContent = BID.slice(-2);

async function load() {
    const content = document.getElementById('content');
    try {
        const r = await fetch('/api/user/' + encodeURIComponent(BID));
        if (!r.ok) throw new Error('Could not load data');
        const d = await r.json();

        const score = d.credit_score || 0;
        const prob = d.default_probability || 0;
        const risk = d.risk_category || 'UNKNOWN';
        const pct = Math.min(Math.round((score / 900) * 100), 100);
        const circumference = 2 * Math.PI * 76;
        const offset = circumference - (pct / 100) * circumference;
        const ringColor = risk === 'LOW' ? 'var(--green)' : risk === 'MEDIUM' ? 'var(--orange)' : 'var(--red)';

        // CIBIL bar
        const cibil = d.cibil_bureau_score || 0;
        const cibilPct = Math.min(((cibil - 300) / 600) * 100, 100);
        const cibilColor = cibil >= 700 ? 'var(--green)' : cibil >= 550 ? 'var(--orange)' : 'var(--red)';

        // DTI bar
        const dti = d.debt_to_income_ratio || 0;
        const dtiPct = Math.min(dti * 100, 100);
        const dtiColor = dti <= 0.3 ? 'var(--green)' : dti <= 0.5 ? 'var(--orange)' : 'var(--red)';

        // Credit util bar
        const cu = d.credit_utilisation_ratio || 0;
        const cuPct = Math.min(cu * 100, 100);
        const cuColor = cu <= 0.3 ? 'var(--green)' : cu <= 0.6 ? 'var(--orange)' : 'var(--red)';

        // Tips based on risk
        let tips = '';
        if (risk === 'HIGH') {
            tips = `
                <div class="tip"><div class="tip-icon" style="background:var(--red-bg);color:var(--red)">!</div><div>Your default probability is high. Consider consolidating debts and reducing credit utilization immediately.</div></div>
                <div class="tip"><div class="tip-icon" style="background:var(--orange-bg);color:var(--orange)">$</div><div>Reduce your Days Past Due (DPD) by making at least minimum payments on all accounts.</div></div>
                <div class="tip"><div class="tip-icon" style="background:var(--accent-glow);color:var(--accent)">i</div><div>Avoid new hard enquiries. Each one can lower your CIBIL score by 5-10 points.</div></div>`;
        } else if (risk === 'MEDIUM') {
            tips = `
                <div class="tip"><div class="tip-icon" style="background:var(--orange-bg);color:var(--orange)">!</div><div>You are in the medium risk zone. Focus on timely payments to improve your score over the next 3-6 months.</div></div>
                <div class="tip"><div class="tip-icon" style="background:var(--green-bg);color:var(--green)">$</div><div>Try to keep your credit utilization below 30% to positively impact your score.</div></div>
                <div class="tip"><div class="tip-icon" style="background:var(--accent-glow);color:var(--accent)">i</div><div>Maintain consistent income and avoid taking new loans in the near term.</div></div>`;
        } else {
            tips = `
                <div class="tip"><div class="tip-icon" style="background:var(--green-bg);color:var(--green)">&#10003;</div><div>Your credit health is good. Keep maintaining timely payments to stay in the low risk category.</div></div>
                <div class="tip"><div class="tip-icon" style="background:var(--green-bg);color:var(--green)">$</div><div>You may be eligible for better loan rates. Consider refinancing high-interest loans.</div></div>
                <div class="tip"><div class="tip-icon" style="background:var(--accent-glow);color:var(--accent)">i</div><div>Building a longer credit history will further strengthen your profile.</div></div>`;
        }

        content.innerHTML = `
        <div class="score-hero">
            <div class="score-ring">
                <svg viewBox="0 0 160 160">
                    <circle class="track" cx="80" cy="80" r="76"/>
                    <circle class="progress" cx="80" cy="80" r="76"
                        stroke="${ringColor}"
                        stroke-dasharray="${circumference}"
                        stroke-dashoffset="${offset}"/>
                </svg>
                <div class="inner">
                    <div class="value" style="color:${ringColor}">${score}</div>
                    <div class="label">Credit Score</div>
                </div>
            </div>
            <div class="risk-pill risk-${risk}"><span class="risk-dot"></span>${risk} RISK</div>
            <p class="hero-sub">Default Probability: ${(prob * 100).toFixed(2)}%</p>
        </div>

        <div class="metrics">
            <div class="metric-card">
                <div class="metric-label">CIBIL Score</div>
                <div class="metric-val" style="color:${cibilColor}">${cibil || 'N/A'}</div>
                <div class="metric-bar"><div class="metric-bar-fill" style="width:${cibilPct}%;background:${cibilColor}"></div></div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Debt-to-Income</div>
                <div class="metric-val" style="color:${dtiColor}">${(dti * 100).toFixed(1)}%</div>
                <div class="metric-bar"><div class="metric-bar-fill" style="width:${dtiPct}%;background:${dtiColor}"></div></div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Credit Utilization</div>
                <div class="metric-val" style="color:${cuColor}">${(cu * 100).toFixed(1)}%</div>
                <div class="metric-bar"><div class="metric-bar-fill" style="width:${cuPct}%;background:${cuColor}"></div></div>
            </div>
        </div>

        <div class="info-grid">
            <div class="info-card">
                <div class="info-card-title">Personal Details</div>
                <div class="info-row"><span class="info-label">Borrower ID</span><span class="info-value">${d.borrower_id}</span></div>
                <div class="info-row"><span class="info-label">Age</span><span class="info-value">${d.borrower_age || '-'}</span></div>
                <div class="info-row"><span class="info-label">Segment</span><span class="info-value">${(d.borrower_segment||'').replace(/_/g,' ')}</span></div>
                <div class="info-row"><span class="info-label">Employment</span><span class="info-value">${d.employment_type || '-'}</span></div>
                <div class="info-row"><span class="info-label">State</span><span class="info-value">${d.state || '-'}</span></div>
                <div class="info-row"><span class="info-label">Urban</span><span class="info-value">${d.is_urban ? 'Yes' : 'No'}</span></div>
            </div>
            <div class="info-card">
                <div class="info-card-title">Financial Details</div>
                <div class="info-row"><span class="info-label">Monthly Income</span><span class="info-value">${d.monthly_net_income_inr ? '&#8377;' + Math.round(d.monthly_net_income_inr).toLocaleString() : '-'}</span></div>
                <div class="info-row"><span class="info-label">Loan Type</span><span class="info-value">${d.loan_type || '-'}</span></div>
                <div class="info-row"><span class="info-label">Loan Amount</span><span class="info-value">${d.loan_amount_requested_inr ? '&#8377;' + Math.round(d.loan_amount_requested_inr).toLocaleString() : '-'}</span></div>
                <div class="info-row"><span class="info-label">Days Past Due</span><span class="info-value" style="color:${(d.days_past_due_dpd||0) > 30 ? 'var(--red)' : 'var(--text)'}">${d.days_past_due_dpd || '0'}</span></div>
                <div class="info-row"><span class="info-label">Late Payments (12m)</span><span class="info-value">${d.num_late_payments_12m || '0'}</span></div>
                <div class="info-row"><span class="info-label">Open Credit Lines</span><span class="info-value">${d.num_open_credit_lines || '-'}</span></div>
            </div>
        </div>

        <div class="tips-card">
            <h3>Recommendations</h3>
            ${tips}
        </div>`;

    } catch(e) {
        content.innerHTML = '<div class="loading-state" style="color:var(--red)">Error loading profile. <a href="/" style="color:var(--accent)">Go back</a></div>';
    }
}
load();
</script>
</body>
</html>
