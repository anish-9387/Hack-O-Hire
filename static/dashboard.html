<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Credit Risk - Company Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root {
    --bg: #0f1117; --surface: #1a1d2e; --surface2: #232740; --border: #2e3348;
    --text: #e4e6f0; --text2: #9498b3;
    --accent: #6366f1; --accent2: #818cf8; --accent-glow: rgba(99,102,241,0.15);
    --green: #22c55e; --green-bg: rgba(34,197,94,0.12);
    --orange: #f59e0b; --orange-bg: rgba(245,158,11,0.12);
    --red: #ef4444; --red-bg: rgba(239,68,68,0.12);
    --radius: 16px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }

/* Sidebar */
.layout { display: flex; min-height: 100vh; }
.sidebar {
    width: 250px; background: var(--surface); border-right: 1px solid var(--border);
    padding: 24px 16px; position: fixed; top: 0; left: 0; bottom: 0;
    display: flex; flex-direction: column; z-index: 10; overflow-y: auto;
}
.logo { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; padding: 0 8px; }
.logo-icon {
    width: 36px; height: 36px; background: linear-gradient(135deg, var(--accent), #a78bfa);
    border-radius: 10px; display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem; font-weight: 800; color: #fff;
}
.logo-text { font-size: 0.95rem; font-weight: 700; }
.logo-text span { display: block; font-size: 0.72rem; color: var(--text2); font-weight: 400; margin-top: 1px; }
.nav-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1.2px; color: var(--text2); margin: 20px 0 8px 10px; font-weight: 600; }
.nav-link {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px;
    color: var(--text2); text-decoration: none; font-size: 0.85rem; font-weight: 500;
    transition: all 0.12s; margin-bottom: 2px;
}
.nav-link:hover { background: var(--surface2); color: var(--text); }
.nav-link.active { background: var(--accent-glow); color: var(--accent2); }
.nav-link svg { width: 17px; height: 17px; flex-shrink: 0; }
.sidebar-footer { margin-top: auto; padding: 12px; border-top: 1px solid var(--border); }
.scheduler-info { font-size: 0.72rem; color: var(--text2); line-height: 1.6; }
.scheduler-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--green); margin-right: 4px; }

/* Main */
.main { margin-left: 250px; flex: 1; padding: 28px 32px; }
.page-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 28px; }
.page-title { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.4px; }
.page-sub { color: var(--text2); font-size: 0.85rem; margin-top: 4px; }
.header-actions { display: flex; gap: 8px; align-items: center; }
.btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 9px 18px;
    background: linear-gradient(135deg, var(--accent), #7c3aed); color: #fff;
    border: none; border-radius: 9px; font-size: 0.82rem; font-weight: 600;
    font-family: 'Inter', sans-serif; cursor: pointer; transition: all 0.15s;
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(99,102,241,0.25); }
.btn:disabled { opacity: 0.5; pointer-events: none; }
.btn svg { width: 14px; height: 14px; }
.btn-ghost {
    padding: 9px 18px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 9px; color: var(--text2); font-size: 0.82rem; font-weight: 500;
    font-family: 'Inter', sans-serif; cursor: pointer;
}
.btn-ghost:hover { color: var(--text); border-color: var(--text2); }
#batchStatus { font-size: 0.78rem; color: var(--accent2); }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-bottom: 24px; }
.stat {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px; position: relative; overflow: hidden;
}
.stat::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--scolor, var(--accent)); }
.stat-label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.7px; color: var(--text2); font-weight: 600; }
.stat-value { font-size: 1.7rem; font-weight: 800; letter-spacing: -1px; margin: 6px 0 2px; color: var(--scolor, var(--text)); }
.stat-sub { font-size: 0.72rem; color: var(--text2); }

/* Chart grid */
.chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
.chart-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 22px; min-height: 300px;
}
.chart-card.full { grid-column: 1 / -1; }
.chart-title { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text2); font-weight: 600; margin-bottom: 16px; }
.chart-wrap { position: relative; height: 260px; }
.chart-card.tall .chart-wrap { height: 320px; }

/* Risk bar */
.risk-bar-wrap { margin-bottom: 24px; }
.risk-bar-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; }
.risk-bar { display: flex; height: 32px; border-radius: 6px; overflow: hidden; background: var(--surface2); }
.risk-seg { display: flex; align-items: center; justify-content: center; font-size: 0.72rem; font-weight: 600; min-width: 36px; transition: width 0.6s; }
.risk-seg.low { background: var(--green); color: #fff; }
.risk-seg.med { background: var(--orange); color: #fff; }
.risk-seg.high { background: var(--red); color: #fff; }
.risk-legend { display: flex; gap: 20px; margin-top: 10px; justify-content: center; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.72rem; color: var(--text2); }
.legend-dot { width: 8px; height: 8px; border-radius: 2px; }

/* Table */
.table-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.table-header { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; border-bottom: 1px solid var(--border); }
.table-header h2 { font-size: 0.9rem; font-weight: 600; }
.badge { padding: 3px 10px; border-radius: 99px; font-size: 0.68rem; font-weight: 600; background: var(--red-bg); color: var(--red); }
.table-wrap { max-height: 420px; overflow-y: auto; }
.table-wrap::-webkit-scrollbar { width: 5px; }
.table-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
table { width: 100%; border-collapse: collapse; }
th { padding: 10px 14px; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.7px; color: var(--text2); font-weight: 600; text-align: left; background: var(--surface2); position: sticky; top: 0; z-index: 1; }
td { padding: 10px 14px; font-size: 0.82rem; border-bottom: 1px solid rgba(46,51,72,0.4); }
tr:hover { background: rgba(99,102,241,0.03); }
.prob-cell { font-weight: 700; color: var(--red); font-variant-numeric: tabular-nums; }
.score-cell { font-weight: 600; font-variant-numeric: tabular-nums; }
.id-cell { color: var(--accent2); font-weight: 500; font-size: 0.78rem; }
.seg-badge { padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; background: var(--surface2); color: var(--text2); }

/* Meta */
.meta-bar {
    display: flex; gap: 20px; align-items: center; justify-content: center;
    padding: 12px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 9px; margin-bottom: 24px; font-size: 0.78rem; color: var(--text2);
}
.meta-bar strong { color: var(--text); }
.meta-sep { width: 3px; height: 3px; border-radius: 50%; background: var(--border); }

/* Loading */
.loading { text-align: center; padding: 100px; color: var(--text2); }
.spinner { width: 32px; height: 32px; border: 3px solid var(--surface2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.5s linear infinite; margin: 0 auto 14px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* No data */
.no-data { text-align: center; padding: 80px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
.no-data h2 { font-size: 1.1rem; margin-bottom: 8px; }
.no-data p { color: var(--text2); margin-bottom: 20px; font-size: 0.88rem; }

@media (max-width: 900px) {
    .sidebar { display: none; }
    .main { margin-left: 0; padding: 20px 14px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .chart-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar">
    <div class="logo">
        <div class="logo-icon">CR</div>
        <div class="logo-text">CreditRisk<span>Company Dashboard</span></div>
    </div>
    <div class="nav-label">Analytics</div>
    <a href="/dashboard" class="nav-link active">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0h4"/></svg>
        Overview
    </a>
    <a href="/docs" class="nav-link">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
        API Docs
    </a>
    <div class="nav-label">System</div>
    <a href="/health" class="nav-link">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        Health
    </a>
    <a href="/model-info" class="nav-link">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
        Model Info
    </a>
    <div class="sidebar-footer">
        <div class="scheduler-info">
            <span class="scheduler-dot"></span> Scheduler active<br>
            Auto re-score every 48h
        </div>
    </div>
</aside>

<main class="main">
    <div class="page-header">
        <div>
            <h1 class="page-title">Portfolio Risk Analytics</h1>
            <p class="page-sub">Real-time credit risk monitoring across 100K borrowers</p>
        </div>
        <div class="header-actions">
            <span id="batchStatus"></span>
            <button onclick="runBatch()" class="btn" id="batchBtn">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                Re-score All
            </button>
            <button onclick="location.reload()" class="btn-ghost">Refresh</button>
        </div>
    </div>
    <div id="content"><div class="loading"><div class="spinner"></div><p>Loading analytics...</p></div></div>
</main>
</div>

<script>
const COLORS = { green: '#22c55e', orange: '#f59e0b', red: '#ef4444', accent: '#6366f1', accent2: '#818cf8', text2: '#9498b3' };
Chart.defaults.color = '#9498b3';
Chart.defaults.borderColor = 'rgba(46,51,72,0.5)';
Chart.defaults.font.family = 'Inter';

async function loadDashboard() {
    const content = document.getElementById('content');
    let summary = null, analytics = null;

    try { const r = await fetch('/batch-summary'); if (r.ok) summary = await r.json(); } catch(e) {}
    if (!summary) {
        content.innerHTML = `<div class="no-data"><h2>No batch results yet</h2><p>Run batch scoring to analyze the full portfolio</p><button onclick="runBatch()" class="btn">Run Batch Scoring</button></div>`;
        return;
    }

    try { const r = await fetch('/analytics-data'); if (r.ok) analytics = await r.json(); } catch(e) {}

    const total = summary.total_borrowers;
    const highPct = ((summary.high_risk_count/total)*100).toFixed(1);
    const medPct = ((summary.medium_risk_count/total)*100).toFixed(1);
    const lowPct = ((summary.low_risk_count/total)*100).toFixed(1);

    let html = `
    <div class="stats">
        <div class="stat" style="--scolor:var(--accent)"><div class="stat-label">Total Borrowers</div><div class="stat-value">${total.toLocaleString()}</div><div class="stat-sub">Scored in ${summary.duration_seconds}s</div></div>
        <div class="stat" style="--scolor:var(--red)"><div class="stat-label">High Risk</div><div class="stat-value">${summary.high_risk_count.toLocaleString()}</div><div class="stat-sub">${highPct}% of portfolio</div></div>
        <div class="stat" style="--scolor:var(--orange)"><div class="stat-label">Medium Risk</div><div class="stat-value">${summary.medium_risk_count.toLocaleString()}</div><div class="stat-sub">${medPct}% of portfolio</div></div>
        <div class="stat" style="--scolor:var(--green)"><div class="stat-label">Low Risk</div><div class="stat-value">${summary.low_risk_count.toLocaleString()}</div><div class="stat-sub">${lowPct}% of portfolio</div></div>
        <div class="stat" style="--scolor:var(--accent2)"><div class="stat-label">Avg Score</div><div class="stat-value">${summary.avg_credit_score}</div><div class="stat-sub">out of 900</div></div>
    </div>

    <div class="risk-bar-wrap"><div class="risk-bar-card">
        <div class="chart-title">Portfolio Risk Distribution</div>
        <div class="risk-bar">
            <div class="risk-seg low" style="width:${lowPct}%">${lowPct}%</div>
            <div class="risk-seg med" style="width:${medPct}%">${medPct}%</div>
            <div class="risk-seg high" style="width:${highPct}%">${highPct}%</div>
        </div>
        <div class="risk-legend">
            <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div>Low</div>
            <div class="legend-item"><div class="legend-dot" style="background:var(--orange)"></div>Medium</div>
            <div class="legend-item"><div class="legend-dot" style="background:var(--red)"></div>High</div>
        </div>
    </div></div>

    <div class="meta-bar">
        <span>Last scored: <strong>${summary.timestamp.slice(0,19).replace('T',' ')}</strong></span>
        <span class="meta-sep"></span>
        <span>Avg Default Prob: <strong>${(summary.avg_default_probability*100).toFixed(2)}%</strong></span>
        <span class="meta-sep"></span>
        <span>Model: <strong>XGBoost</strong></span>
    </div>

    <div class="chart-grid">
        <div class="chart-card"><div class="chart-title">Risk by State (Top 10)</div><div class="chart-wrap"><canvas id="chartState"></canvas></div></div>
        <div class="chart-card"><div class="chart-title">Risk by Borrower Segment</div><div class="chart-wrap"><canvas id="chartSegment"></canvas></div></div>
        <div class="chart-card"><div class="chart-title">Risk by Loan Type</div><div class="chart-wrap"><canvas id="chartLoan"></canvas></div></div>
        <div class="chart-card"><div class="chart-title">Risk by Age Group</div><div class="chart-wrap"><canvas id="chartAge"></canvas></div></div>
        <div class="chart-card"><div class="chart-title">Credit Score Distribution</div><div class="chart-wrap"><canvas id="chartScore"></canvas></div></div>
        <div class="chart-card"><div class="chart-title">Default Probability Distribution</div><div class="chart-wrap"><canvas id="chartProb"></canvas></div></div>
        <div class="chart-card"><div class="chart-title">Risk Breakdown (Pie)</div><div class="chart-wrap"><canvas id="chartPie"></canvas></div></div>
        <div class="chart-card"><div class="chart-title">Top Risk Factors (Feature Importance)</div><div class="chart-wrap"><canvas id="chartFeatures"></canvas></div></div>
    </div>`;

    // High risk table
    html += `
    <div class="table-card">
        <div class="table-header"><h2>High Risk Borrowers</h2><span class="badge">${summary.high_risk_count.toLocaleString()} flagged</span></div>
        <div class="table-wrap"><table>
            <thead><tr><th>ID</th><th>Segment</th><th>State</th><th>CIBIL</th><th>DPD</th><th>Default Prob</th><th>Score</th></tr></thead>
            <tbody id="tableBody"><tr><td colspan="7" style="text-align:center;padding:30px;color:var(--text2)">Loading...</td></tr></tbody>
        </table></div>
    </div>`;

    content.innerHTML = html;

    // ── Render charts ──
    if (!analytics) return;
    const stackedOpts = { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, grid: { color: 'rgba(46,51,72,0.3)' } } } };

    // State
    if (analytics.risk_by_state?.labels) {
        new Chart(document.getElementById('chartState'), { type: 'bar', data: {
            labels: analytics.risk_by_state.labels,
            datasets: [
                { label: 'High', data: analytics.risk_by_state.high, backgroundColor: COLORS.red },
                { label: 'Medium', data: analytics.risk_by_state.medium, backgroundColor: COLORS.orange },
                { label: 'Low', data: analytics.risk_by_state.low, backgroundColor: COLORS.green },
            ]}, options: stackedOpts });
    }
    // Segment
    if (analytics.risk_by_segment?.labels) {
        new Chart(document.getElementById('chartSegment'), { type: 'bar', data: {
            labels: analytics.risk_by_segment.labels,
            datasets: [
                { label: 'High', data: analytics.risk_by_segment.high, backgroundColor: COLORS.red },
                { label: 'Medium', data: analytics.risk_by_segment.medium, backgroundColor: COLORS.orange },
                { label: 'Low', data: analytics.risk_by_segment.low, backgroundColor: COLORS.green },
            ]}, options: stackedOpts });
    }
    // Loan type
    if (analytics.risk_by_loan?.labels) {
        new Chart(document.getElementById('chartLoan'), { type: 'bar', data: {
            labels: analytics.risk_by_loan.labels,
            datasets: [
                { label: 'High', data: analytics.risk_by_loan.high, backgroundColor: COLORS.red },
                { label: 'Medium', data: analytics.risk_by_loan.medium, backgroundColor: COLORS.orange },
                { label: 'Low', data: analytics.risk_by_loan.low, backgroundColor: COLORS.green },
            ]}, options: stackedOpts });
    }
    // Age
    if (analytics.age_risk?.labels) {
        new Chart(document.getElementById('chartAge'), { type: 'bar', data: {
            labels: analytics.age_risk.labels,
            datasets: [
                { label: 'High', data: analytics.age_risk.high, backgroundColor: COLORS.red },
                { label: 'Medium', data: analytics.age_risk.medium, backgroundColor: COLORS.orange },
                { label: 'Low', data: analytics.age_risk.low, backgroundColor: COLORS.green },
            ]}, options: stackedOpts });
    }
    // Score distribution
    if (analytics.score_distribution) {
        new Chart(document.getElementById('chartScore'), { type: 'bar', data: {
            labels: analytics.score_distribution.labels,
            datasets: [{ data: analytics.score_distribution.counts, backgroundColor: COLORS.accent + '90', borderRadius: 4 }]
        }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false } }, y: { grid: { color: 'rgba(46,51,72,0.3)' } } } } });
    }
    // Probability distribution
    if (analytics.probability_distribution) {
        new Chart(document.getElementById('chartProb'), { type: 'bar', data: {
            labels: analytics.probability_distribution.labels,
            datasets: [{ data: analytics.probability_distribution.counts, backgroundColor: analytics.probability_distribution.counts.map((_,i) => i < 5 ? COLORS.green + '80' : i < 7 ? COLORS.orange + '80' : COLORS.red + '80'), borderRadius: 4 }]
        }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false } }, y: { grid: { color: 'rgba(46,51,72,0.3)' } } } } });
    }
    // Pie
    if (analytics.risk_counts) {
        new Chart(document.getElementById('chartPie'), { type: 'doughnut', data: {
            labels: ['Low', 'Medium', 'High'],
            datasets: [{ data: [analytics.risk_counts.LOW||0, analytics.risk_counts.MEDIUM||0, analytics.risk_counts.HIGH||0], backgroundColor: [COLORS.green, COLORS.orange, COLORS.red], borderWidth: 0 }]
        }, options: { responsive: true, maintainAspectRatio: false, cutout: '65%', plugins: { legend: { position: 'bottom', labels: { padding: 16, usePointStyle: true, pointStyle: 'circle' } } } } });
    }
    // Feature importance
    if (analytics.feature_importance?.labels) {
        new Chart(document.getElementById('chartFeatures'), { type: 'bar', data: {
            labels: analytics.feature_importance.labels,
            datasets: [{ data: analytics.feature_importance.values, backgroundColor: COLORS.accent2 + '80', borderRadius: 4 }]
        }, options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grid: { color: 'rgba(46,51,72,0.3)' } }, y: { grid: { display: false } } } } });
    }

    // Load table
    try {
        const r = await fetch('/high-risk-data');
        if (r.ok) {
            const rows = await r.json();
            document.getElementById('tableBody').innerHTML = rows.map(row => `<tr>
                <td class="id-cell">${row.borrower_id}</td>
                <td><span class="seg-badge">${row.borrower_segment||'-'}</span></td>
                <td>${row.state||'-'}</td>
                <td>${row.cibil_bureau_score||'-'}</td>
                <td>${row.days_past_due_dpd||'-'}</td>
                <td class="prob-cell">${row.default_probability?(row.default_probability*100).toFixed(2)+'%':'-'}</td>
                <td class="score-cell">${row.credit_score||'-'}</td>
            </tr>`).join('');
        }
    } catch(e) {}
}

async function runBatch() {
    const btn = document.getElementById('batchBtn');
    const st = document.getElementById('batchStatus');
    btn.disabled = true; btn.innerHTML = 'Scoring...';
    st.textContent = 'Scoring 100K borrowers...';
    try { await fetch('/run-batch', {method:'POST'}); st.textContent = 'Done! Refreshing...'; setTimeout(()=>location.reload(), 8000); }
    catch(e) { st.textContent = 'Error'; btn.disabled = false; btn.innerHTML = 'Re-score All'; }
}

loadDashboard();
</script>
</body>
</html>
