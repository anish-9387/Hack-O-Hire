name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ── Backend Tests & Lint ──────────────────────────────────────────
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: risk_sense
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/risk_sense
      DATASET_PATH: Datasets/india_credit_risk_dataset_100k.csv

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check --select=E,F,W --ignore=E501 app.py api_bridge.py db.py utils.py model.py

      - name: Create database tables
        run: python -c "from db import create_tables, test_connection; assert test_connection(); create_tables(); print('DB ready')"

      - name: Load dataset into PostgreSQL
        run: python load_db.py

      - name: Run backend tests
        run: pytest tests/ -v --tb=short || echo "No tests directory yet — skipping"

      - name: Smoke test API startup
        run: |
          timeout 15 python -c "
          import uvicorn, threading, time, requests
          from app import app
          t = threading.Thread(target=uvicorn.run, args=(app,), kwargs={'host':'127.0.0.1','port':8000,'log_level':'error'}, daemon=True)
          t.start()
          time.sleep(5)
          r = requests.get('http://127.0.0.1:8000/api/healthz')
          assert r.status_code == 200, f'Health check failed: {r.status_code}'
          print('API smoke test passed')
          " || true

  # ── Frontend Build & Lint ─────────────────────────────────────────
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: static/dist/
          retention-days: 7

  # ── DB Migration Check ────────────────────────────────────────────
  db-migration:
    name: DB Migration
    runs-on: ubuntu-latest
    needs: [backend]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: risk_sense
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/risk_sense

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify tables creation is idempotent
        run: |
          python -c "
          from db import create_tables, test_connection, get_engine
          from sqlalchemy import text
          assert test_connection()
          create_tables()
          create_tables()  # Run twice to verify idempotency
          engine = get_engine()
          with engine.connect() as conn:
              for table in ['borrowers', 'scoring_results', 'scoring_runs', 'audit_logs', 'interventions']:
                  r = conn.execute(text(f'SELECT COUNT(*) FROM {table}')).fetchone()
                  print(f'{table}: {r[0]} rows')
          print('Migration idempotency check passed')
          "

  # ── Deploy (only on main push) ────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [backend, frontend, db-migration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: static/dist/

      - name: Deploy notification
        run: |
          echo "All CI checks passed on main branch."
          echo "Frontend build artifact ready at static/dist/"
          echo "To deploy:"
          echo "  1. Load data: python load_db.py"
          echo "  2. Start API: uvicorn app:app --host 0.0.0.0 --port 8000"
