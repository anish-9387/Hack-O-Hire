# Application Configuration
app_name: Financial Stress Prediction API
version: 1.0.0
environment: development

# Model Configuration
model:
  artifacts_dir: src/model/artifacts
  risk_thresholds:
    high: 0.75
    medium: 0.50
    low: 0.25

# Alert Configuration
alerts:
  enabled: true
  high_risk_threshold: 0.75
  email_enabled: false
  sms_enabled: false
  log_enabled: true

# Kafka Configuration
kafka:
  bootstrap_servers:
    - localhost:9092
  topics:
    transactions: bank-transactions
    alerts: risk-alerts
  consumer_group: risk-processor

# Dashboard Configuration
dashboard:
  host: 0.0.0.0
  port: 8050
  debug: true

# API Configuration
api:
  host: 0.0.0.0
  port: 8000
  reload: true
  workers: 1

# Database Configuration (optional)
database:
  type: sqlite
  path: data/app_database.db

# Logging
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: logs/app.log
